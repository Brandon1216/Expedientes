server.port=8080

# La página siempre se pide de nuevo. Los archivos dentro del .jar tienen todos la misma fecha (1980):
# con Last-Modified el servidor contesta "no cambió" y el navegador sigue mostrando la versión anterior.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true

# Registro de lo que hace el servidor (útil si algo falla en el programa de escritorio)
logging.file.name=${app.datos}/expedientes.log
logging.logback.rollingpolicy.max-history=14

# Carpeta donde viven la base de datos, los respaldos y el registro.
# Se crea sola; una base vieja en backend/expedientes.db se copia aquí la primera vez.
app.datos=C:/Expedientes/datos
# Respaldos diarios automáticos (se guardan los últimos N días)
app.respaldos.carpeta=C:/Expedientes/respaldos
app.respaldos.conservar=30

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:${app.datos}/expedientes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite trabaja mejor con una sola conexión
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql al iniciar (las tablas usan IF NOT EXISTS)
spring.sql.init.mode=always

# La clave que firma las sesiones se genera en ${app.datos}/clave-sesiones.key
# Duración de la sesión en horas
app.token.horas=12

# Origen permitido del frontend (Vite)
app.cors.origen=http://localhost:5173

# Usuario administrador inicial (solo se crea si no hay usuarios). Debe cambiar la contraseña al entrar.
app.admin.usuario=OficialMayor
app.admin.password=admin123
