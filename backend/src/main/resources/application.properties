server.port=8080

# Base de datos SQLite (se crea sola en la carpeta backend/)
spring.datasource.url=jdbc:sqlite:expedientes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite trabaja mejor con una sola conexión
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql al iniciar (las tablas usan IF NOT EXISTS)
spring.sql.init.mode=always

# Clave para firmar los tokens de sesión. CÁMBIALA en producción.
app.token.secret=cambia-esta-clave-por-una-larga-y-secreta-2026
# Duración de la sesión en horas
app.token.horas=12

# Origen permitido del frontend (Vite)
app.cors.origen=http://localhost:5173

# Usuario administrador inicial (solo se crea si no hay usuarios)
app.admin.usuario=admin
app.admin.password=admin123
